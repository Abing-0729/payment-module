name: CI

on:
  # 任意分支的 PR 到 dev/main 都触发质量检查
  pull_request:
    branches: [develop, main]
  # push 到 main/dev（PR 合并成功）后也跑一轮检查
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 服务容器：凭据与本地 deploy/docker-compose/docker-compose.yml 保持一致（payment/payment/payment），
    # 这样 Makefile 默认的 POSTGRES_DSN 在本地和 CI 都无需改动
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 安装 buf / protoc 插件 / wire / sqlc / goose 到 GOPATH/bin（setup-go 已将其加入 PATH）
      - name: Install tools
        run: make tools

      # 与本地验收命令完全一致：格式 + 生成一致性 + 迁移 + vet + 竞态测试 + 构建
      - name: Verify
        run: make verify
