name: CI

on:
  # 任意分支的 PR 都触发质量检查（不再限定 main）
  pull_request:
    branches: [main]
  # push 到 main（PR 合并成功）后也跑一轮检查
  push:
    branches: [main,develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: make tools

      - name: Format check
        run: make fmt-check

      - name: Generated code check
        run: make generate-check

      - name: Vet
        run: go vet ./...

  unit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: make unit-test

      - name: Race tests
        run: make race-test

