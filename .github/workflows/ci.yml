name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: make tools

      - name: Format check
        run: make fmt-check

      - name: Generated code check
        run: make generate-check

      - name: Vet
        run: go vet ./...

  unit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: make unit-test

      - name: Race tests
        run: make race-test

  integration:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        run: make migrate-up
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/commerce_test?sslmode=disable

      - name: Integration tests
        run: make integration-test
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/commerce_test?sslmode=disable
          REDIS_ADDR: localhost:6379

  docker:
    needs: [quality, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: ci