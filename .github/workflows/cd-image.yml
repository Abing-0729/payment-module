name: CD - Docker Images

on:
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # 仅当 dev -> main 的 PR 合并后，或打 v*.*.* 标签时构建
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev')

    steps:
      - uses: actions/checkout@v4
        with:
          # PR 合并后检出 merge commit（main 上的最新代码）；tag 推送时检出 tag 指向的 commit
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: make tools

      - name: Run verification
        run: make verify

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/commerce
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'pull_request' }}

      - name: Build commerce image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/commerce/Dockerfile
          push: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
