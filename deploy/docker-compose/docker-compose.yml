name: payment-lab
services:
    postgres:
      image: postgres:16-alpine
      container_name: payment-postgres
      environment:
        POSTGRES_USER: payment
        POSTGRES_PASSWORD: payment
        POSTGRES_DB: payment
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
        interval: 5s
        timeout: 3s
        retries: 10

volumes:
  postgres_data:
