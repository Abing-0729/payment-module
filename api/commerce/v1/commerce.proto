syntax = "proto3";

package commerce.v1;

import "google/api/annotations.proto";


option go_package = "kratos-payment-lab/api/commerce/v1;v1";

// Health 提供健康检查接口。
// Issue 1 为存活级（进程存活即返回 SERVING）；
// Issue 2 接入 PostgreSQL 后升级为就绪检查（Check 内部 ping DB/Redis）。
service HealthService {
  // Check 返回服务名与状态。
  rpc Check(CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
  }
}

message CheckRequest {}

message CheckResponse {
  string service = 1;
  // SERVING / NOT_SERVING
  string status = 2;
}

message CreateOrderRequest {
  int64 user_id = 1;
  int64 amount_cents = 2;
}
message CreateOrderResponse {
  Order order = 1;
}
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{order_no}"
    };
  }
}

message GetOrderRequest {
  string order_no = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message Order {
  string order_no = 1;
  int64 user_id = 2;
  int64 amount_cents = 3;
  string status = 4;
  int64 version = 5;
  int64 created_at_unix = 6;
  int64 updated_at_unix = 7;
}
